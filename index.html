<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <title>ЛБТЭК — версии прототипа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-width: 320px;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      background: #FFFFFF;
      color: #18191B;
      font-family: "Inter", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 480px;
    }

    .brand {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #B81C22;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      font-weight: 500;
      line-height: 38px;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0 0 40px;
      font-size: 15px;
      line-height: 24px;
      color: #686B70;
    }

    .versions {
      display: grid;
      gap: 12px;
    }

    .version-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 14px 20px;
      border: 1px solid #E4E5E8;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      line-height: 20px;
      transition: border-color 180ms ease, background-color 180ms ease;
    }

    .version-link small {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      font-weight: 400;
      line-height: 18px;
      color: #686B70;
    }

    .version-link svg {
      flex: none;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 180ms ease;
    }

    .version-link:hover {
      border-color: #B81C22;
    }

    .version-link:hover svg {
      transform: translate(2px, -2px);
    }

    .version-link.primary {
      background: #B81C22;
      border-color: #B81C22;
      color: #FFFFFF;
    }

    .version-link.primary small {
      color: rgba(255, 255, 255, 0.75);
    }

    .version-link.primary:hover {
      background: #98171C;
    }

    .version-link:focus-visible {
      outline: 2px solid #B81C22;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 26px;
        line-height: 32px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">ЛБТЭК</p>
    <h1>Версии прототипа</h1>
    <p class="lead">Выберите версию главной страницы для просмотра.</p>

    <nav class="versions" aria-label="Версии прототипа">
      <a class="version-link primary" href="./v1/index.html">
        <span>Основная версия<small>Главная страница · v1</small></span>
        <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M4 10 10 4M6 4h4v4"/></svg>
      </a>
      <a class="version-link" href="./v2/index.html">
        <span>Дополнительная версия 1<small>Альтернативная компоновка · v2</small></span>
        <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M4 10 10 4M6 4h4v4"/></svg>
      </a>
      <a class="version-link" href="./v3/index.html">
        <span>Дополнительная версия 2<small>Альтернативная компоновка · v3</small></span>
        <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M4 10 10 4M6 4h4v4"/></svg>
      </a>
    </nav>
  </main>
</body>
</html>
